/* NAVBAR */

nav{

.nav-container{
display:flex;

}

/* GALERIE */

.gallery{
max-width:1200px;
margin:auto;
padding:60px 20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.gallery img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
transition:0.4s;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.gallery img:hover{
transform:scale(1.08);
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
align-items:center;
justify-content:center;
}

.lightbox img{
max-width:90%;
max-height:80%;
border-radius:10px;
}
